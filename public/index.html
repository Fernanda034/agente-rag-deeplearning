<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente de Deep Learning</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300B4D8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 7l8 0 M4 7l8 10 M4 17l8 -10 M4 17l8 0 M12 7l8 5 M12 17l8 -5' stroke-width='1' opacity='0.6'/><circle cx='4' cy='7' r='2.5' fill='%230E1014'/><circle cx='4' cy='17' r='2.5' fill='%230E1014'/><circle cx='12' cy='7' r='2.5' fill='%230E1014'/><circle cx='12' cy='17' r='2.5' fill='%230E1014'/><circle cx='20' cy='12' r='2.5' fill='%230E1014'/></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0E1014',
            surfaceHeader: '#13181F',
            surfaceInput: '#13181F',
            surfaceUser: '#151B23',
            surfaceAgent: '#111821',
            inputBg: '#0D1117',
            borderHeader: '#1E2530',
            borderInput: '#1E2D35',
            primary: '#E6EDF3',
            userText: '#C9D1D9',
            secondary: '#8B949E',
            meta: '#4A5568',
            accent: '#00B4D8',
            chipBg: '#0D1D24',
            codeBg: '#0A0F14',
            codeText: '#A8D8E8'
          },
          fontFamily: {
            serif: ['"DM Serif Display"', 'serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
            sans: ['"Instrument Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0E1014;
      color: #E6EDF3;
      font-family: "Instrument Sans", sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1E2530; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4A5568; }

    /* Custom Prose for Markdown inside Agent messages */
    .prose-custom { word-break: break-word; overflow-wrap: anywhere; }
    .prose-custom p { margin-bottom: 0.75rem; line-height: 1.75; font-size: 15px; color: #E6EDF3; }
    .prose-custom p:last-child { margin-bottom: 0; }
    .prose-custom ul, .prose-custom ol { margin: 0.5rem 0 0.5rem 1.2rem; list-style-position: outside; }
    .prose-custom ul { list-style-type: disc; }
    .prose-custom ol { list-style-type: decimal; }
    .prose-custom li { margin-bottom: 0.25rem; font-size: 15px; line-height: 1.75; color: #E6EDF3; }
    .prose-custom h1, .prose-custom h2, .prose-custom h3, .prose-custom h4 { 
      font-weight: 600; margin: 1.5rem 0 0.75rem; color: #E6EDF3; 
    }
    .prose-custom h1 { font-size: 1.2rem; }
    .prose-custom h2 { font-size: 1.1rem; }
    .prose-custom h3 { font-size: 1rem; }
    .prose-custom strong { font-weight: 600; color: #E6EDF3; }
    .prose-custom em { font-style: italic; }
    
    .prose-custom blockquote {
      border-left: 2px solid #8B949E;
      padding-left: 1rem;
      color: #8B949E;
      margin: 1rem 0;
      font-style: italic;
    }

    /* Code Blocks */
    .prose-custom pre {
      background-color: #0A0F14;
      border-left: 2px solid #00B4D8;
      padding: 12px 16px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      overflow-x: auto;
      margin: 1rem 0;
      color: #A8D8E8;
    }
    .prose-custom pre code {
      background: transparent;
      color: inherit;
      font-size: inherit;
      padding: 0;
    }
    
    /* Inline Code */
    .prose-custom code:not(pre code) {
      font-family: "IBM Plex Mono", monospace;
      color: #00B4D8;
      font-size: 13.5px;
      background: rgba(0, 180, 216, 0.05);
      padding: 0.1rem 0.25rem;
      border-radius: 2px;
    }

    .prose-custom .katex-display { overflow-x: auto; padding: 0.5rem 0; }

    /* Thinking Dots */
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #00B4D8;
      margin-right: 4px;
      animation: blink 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* Sources */
    .source-citation {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: #8B949E;
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* Message entrance animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row { animation: fadeIn 0.2s ease-out forwards; }

    /* Custom Input caret and placeholder */
    #user-input {
      caret-color: #00B4D8;
    }
    #user-input::placeholder {
      color: #4A5568;
    }

    /* Topic Chips */
    .topic-chip {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: #8B949E;
      background-color: #0D1D24;
      border: 1px solid #1E2D35;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
    }
    .topic-chip:hover {
      border-left: 2px solid #00B4D8;
      color: #E6EDF3;
    }
  </style>
</head>

<body class="bg-bg flex flex-col h-screen overflow-hidden antialiased selection:bg-accent/20 selection:text-primary">

  <!-- Header -->
  <header class="bg-surfaceHeader border-b border-borderHeader py-5 pl-6 pr-6 flex items-center justify-between flex-shrink-0 z-10 shadow-sm">
    <div class="max-w-[740px] w-full mx-auto flex items-center justify-between px-8">
      <div class="flex items-center gap-3">
        <!-- Neural Network / Nodes Icon -->
        <svg class="text-accent w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7l8 0 M4 7l8 10 M4 17l8 -10 M4 17l8 0 M12 7l8 5 M12 17l8 -5" stroke-width="1" opacity="0.6"></path>
          <circle cx="4" cy="7" r="2.5" fill="#13181F"></circle>
          <circle cx="4" cy="17" r="2.5" fill="#13181F"></circle>
          <circle cx="12" cy="7" r="2.5" fill="#13181F"></circle>
          <circle cx="12" cy="17" r="2.5" fill="#13181F"></circle>
          <circle cx="20" cy="12" r="2.5" fill="#13181F"></circle>
        </svg>
        <div class="flex items-baseline gap-3">
          <h1 class="font-serif italic font-bold text-[22px] text-white tracking-wide">Agente de Deep Learning</h1>
          <span class="font-mono text-[11px] text-secondary">Llama 3.3 70b · active</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Chat Area -->
  <main id="chat-container" class="flex-1 overflow-y-auto scroll-smooth flex flex-col w-full relative">
    <div class="max-w-[740px] w-full mx-auto px-8 pt-10 pb-8 flex flex-col gap-[24px]">
      
      <div id="messages" class="flex flex-col gap-[24px] w-full">
        <!-- Welcome / Empty State -->
        <div class="msg-row flex flex-col items-center justify-center w-full mt-10 mb-10" id="welcome-block">
          <div class="font-mono text-[11px] text-accent uppercase tracking-wider mb-4 flex items-center gap-1.5">
            <span>✦</span> AXIOM
          </div>
          <div class="font-sans text-[18px] text-primary mb-8 text-center">
            Estoy en línea y listo para ayudarte con tus consultas e investigación en Deep Learning. ¿En qué te puedo ayudar?
          </div>
          
          <div class="flex flex-wrap items-center justify-center gap-3">
            <button class="topic-chip" onclick="sendTopic('Explicar backpropagation')">Explicar backpropagation</button>
            <button class="topic-chip" onclick="sendTopic('Comparar Adam vs SGD')">Comparar Adam vs SGD</button>
            <button class="topic-chip" onclick="sendTopic('¿Qué es dropout regularization?')">¿Qué es dropout regularization?</button>
            <button class="topic-chip" onclick="sendTopic('Visualizar una red neuronal')">Visualizar una red neuronal</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="bg-surfaceInput border-t border-borderHeader flex-shrink-0 z-10 px-6 py-[14px]">
    <div class="max-w-[740px] w-full mx-auto px-8">
      <div class="relative flex items-center bg-inputBg border border-borderInput rounded-[10px] px-4 py-3 focus-within:border-accent/50 transition-colors">
        <span class="text-accent mr-2 font-mono text-[13px] opacity-80">|</span>
        <textarea
          id="user-input"
          rows="1"
          placeholder="ask the model anything..."
          class="w-full bg-transparent border-none outline-none font-mono text-[13px] text-primary resize-none overflow-hidden block py-0 pr-8"
          onkeydown="handleKey(event)"
          oninput="handleInput(this)"
        ></textarea>
        
        <button id="send-btn" onclick="sendMessage()" class="absolute right-4 text-accent transition-opacity opacity-0 disabled:cursor-not-allowed pointer-events-none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script>
    const API_URL = '/api/chat';
    const history = [];

    marked.use({ breaks: true, gfm: true });

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function handleInput(el) {
      autoResize(el);
      const btn = document.getElementById('send-btn');
      if (el.value.trim().length > 0) {
        btn.classList.remove('opacity-0', 'pointer-events-none');
        btn.classList.add('opacity-100', 'pointer-events-auto');
      } else {
        btn.classList.add('opacity-0', 'pointer-events-none');
        btn.classList.remove('opacity-100', 'pointer-events-auto');
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        sendMessage(); 
      }
    }

    function sendTopic(topic) {
      document.getElementById('user-input').value = topic;
      handleInput(document.getElementById('user-input'));
      sendMessage();
    }

    function scrollBottom() {
      const c = document.getElementById('chat-container');
      c.scrollTop = c.scrollHeight;
    }

    function renderMath(node) {
      renderMathInElement(node, {
        delimiters: [
          { left: '$$', right: '$$', display: true  },
          { left: '$',  right: '$',  display: false },
          { left: '\\[', right: '\\]', display: true  },
          { left: '\\(', right: '\\)', display: false },
        ],
        throwOnError: false,
      });
    }

    function getTimeString() {
      const now = new Date();
      return now.toLocaleTimeString('en-US', { hour12: false });
    }

    function buildSourcesRow(sources) {
      if (!sources || sources.length === 0) return null;
      const row = document.createElement('div');
      row.className = 'source-citation';
      
      sources.forEach((s, i) => {
        const topic = s.topic ? s.topic.replace(/_/g, ' ') : '';
        const page = s.page ? `p.${s.page}` : '';
        const parts = [s.file, page, topic].filter(Boolean).join(' · ');
        
        const item = document.createElement('span');
        item.textContent = `[${i + 1}] ${parts}`;
        row.appendChild(item);
      });
      return row;
    }

    function appendUser(message) {
      const welcome = document.getElementById('welcome-block');
      if (welcome) welcome.remove();

      const container = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row flex gap-3 flex-row-reverse w-full';
      
      row.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-surfaceUser border border-borderHeader flex items-center justify-center text-sm flex-shrink-0 mt-0.5">
          👤
        </div>
        <div class="flex flex-col gap-1 items-end max-w-[82%]">
          <span class="font-mono text-[11px] text-secondary uppercase tracking-wider">Tú</span>
          <div class="font-sans text-[15px] text-userText bg-surfaceUser rounded-[12px] rounded-tr-[2px] px-[16px] py-[10px] text-left whitespace-pre-wrap leading-[1.6] break-words">${escapeHtml(message)}</div>
          <div class="font-mono text-[10px] text-meta mt-1">${getTimeString()}</div>
        </div>
      `;
      
      container.appendChild(row);
      scrollBottom();
    }

    function appendAssistant(content, sources) {
      const container = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row flex flex-col items-start w-full';

      const label = document.createElement('div');
      label.className = 'font-mono text-[11px] text-accent mb-[16px] uppercase tracking-wider flex items-center gap-1.5';
      label.innerHTML = `<span>✦</span> AXIOM`;
      
      const box = document.createElement('div');
      box.className = 'bg-surfaceAgent rounded-[12px] rounded-tl-[2px] px-[18px] py-[14px] w-fit max-w-[85%] overflow-hidden';
      
      const textContainer = document.createElement('div');
      textContainer.className = 'font-sans text-[15px] text-primary prose-custom';
      
      // Proteger las fórmulas matemáticas de marked.js
      let mathBlocks = [];
      // Proteger bloques $$ ... $$
      let safeContent = content.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
        mathBlocks.push(match);
        return `%%%MATH_BLOCK_${mathBlocks.length - 1}%%%`;
      });
      // Proteger variables inline $ ... $
      safeContent = safeContent.replace(/\$([^\n\$]*?)\$/g, (match) => {
        mathBlocks.push(match);
        return `%%%MATH_BLOCK_${mathBlocks.length - 1}%%%`;
      });

      // Parsear el markdown (ya sin matemáticas que interfieran)
      let parsedHtml = marked.parse(safeContent);

      // Restaurar las fórmulas
      mathBlocks.forEach((block, i) => {
        parsedHtml = parsedHtml.replace(`%%%MATH_BLOCK_${i}%%%`, block);
      });

      textContainer.innerHTML = parsedHtml;
      renderMath(textContainer);
      
      box.appendChild(textContainer);

      const citRow = buildSourcesRow(sources);
      if (citRow) {
        box.appendChild(citRow);
      }

      row.appendChild(label);
      row.appendChild(box);
      container.appendChild(row);
      scrollBottom();
    }

    function showThinking() {
      const container = document.getElementById('messages');
      const row = document.createElement('div');
      row.id = 'thinking-row';
      row.className = 'msg-row flex flex-col items-start w-full';
      row.innerHTML = `
        <div class="font-mono text-[11px] text-accent mb-[16px] uppercase tracking-wider flex items-center gap-1.5">
          <span>✦</span> AXIOM
        </div>
        <div class="bg-surfaceAgent rounded-[12px] rounded-tl-[2px] px-[18px] py-[12px] w-fit flex items-center">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      `;
      container.appendChild(row);
      scrollBottom();
    }

    function hideThinking() {
      document.getElementById('thinking-row')?.remove();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const btn = document.getElementById('send-btn');
      const message = input.value.trim();
      
      if (!message) return;

      input.value = '';
      input.style.height = 'auto';
      handleInput(input);
      btn.disabled = true;

      appendUser(message);
      history.push({ role: 'user', content: message });
      showThinking();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history: history.slice(0, -1) }),
        });

        hideThinking();

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          appendAssistant(`Error ${res.status}: ${err.error || res.statusText}`, []);
          return;
        }

        const data = await res.json();
        appendAssistant(data.response || 'No response.', data.sources || []);
        history.push({ role: 'assistant', content: data.response || '' });
        
      } catch (err) {
        hideThinking();
        appendAssistant('Connection error. Please check if the API server is running.', []);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    document.getElementById('user-input').focus();
  </script>
</body>
</html>
